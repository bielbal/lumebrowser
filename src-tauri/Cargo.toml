[package]
name = "lumebrowser"
version = "0.1.0"
description = "Lume Browser — lightweight, modern browser"
authors = []
edition = "2021"

[lib]
name = "lumebrowser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lumebrowser"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri       = { version = "2", features = ["devtools"] }
tauri-plugin-shell  = "2"
tauri-plugin-fs     = "2"
tauri-plugin-dialog = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
url         = "2"
tokio       = { version = "1", features = ["full"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic   = "abort"
codegen-units = 1
lto     = true
opt-level = "s"
strip   = true
